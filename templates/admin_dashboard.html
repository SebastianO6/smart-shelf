<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>

<header class="admin-header">
    <h1>Admin Dashboard</h1>
    <div class="header-actions">
        <a href="/borrowed" class="btn-secondary">View Borrowed Books</a>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</header>

<div class="container">

<h2>Books</h2>

<div class="top-actions">
    <a href="/add" class="btn-primary">+ Add Book</a>
    <input type="text" class="live-search" placeholder="Search books..." value="{{ search }}">
</div>

<table>
<thead>
<tr>
    <th>Title</th>
    <th>Author</th>
    <th>Category</th>
    <th>Available</th>
    <th>Actions</th>
</tr>
</thead>
<tbody>
{% for book in books %}
<tr>
    <td>{{ book['title'] }}</td>
    <td>{{ book['author'] }}</td>
    <td>{{ book['category'] }}</td>
    <td>{{ book['quantity'] }}</td>
    <td class="actions">
        <a href="/edit/{{ book['id'] }}">Edit</a> |
        <a href="/delete/{{ book['id'] }}" onclick="return confirmDelete()">Delete</a> |
        <a href="/borrow/{{ book['id'] }}">Borrow</a>
    </td>

</tr>
{% endfor %}
</tbody>
</table>

</div>
</body>
</html>
